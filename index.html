<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Феникс 🔥</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .bg-grid {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 80, 80, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 144, 0, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    .bg-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -10%;
      width: 60%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(255, 80, 80, 0.07), transparent 60%);
      animation: glow-drift 12s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 60%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(188, 140, 255, 0.06), transparent 60%);
      animation: glow-drift 12s ease-in-out infinite alternate-reverse;
    }
    @keyframes glow-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ff5050;
      border-radius: 50%;
      opacity: 0;
      animation: particle-float 8s infinite;
      box-shadow: 0 0 6px #ff5050;
    }
    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 7s; }
    .particle:nth-child(2) { left: 25%; animation-delay: 1.2s; animation-duration: 9s; width: 2px; height: 2px; background: #ff9000; box-shadow: 0 0 6px #ff9000; }
    .particle:nth-child(3) { left: 40%; animation-delay: 2.5s; animation-duration: 6s; background: #bc8cff; box-shadow: 0 0 6px #bc8cff; }
    .particle:nth-child(4) { left: 55%; animation-delay: 0.8s; animation-duration: 8s; width: 4px; height: 4px; }
    .particle:nth-child(5) { left: 70%; animation-delay: 3.1s; animation-duration: 7.5s; background: #ff9000; box-shadow: 0 0 6px #ff9000; }
    .particle:nth-child(6) { left: 85%; animation-delay: 1.8s; animation-duration: 9.5s; width: 2px; height: 2px; }
    .particle:nth-child(7) { left: 50%; animation-delay: 4.2s; animation-duration: 6.5s; background: #bc8cff; box-shadow: 0 0 6px #bc8cff; }
    .particle:nth-child(8) { left: 15%; animation-delay: 5.0s; animation-duration: 8.2s; width: 3px; height: 3px; }
    .particle:nth-child(9) { left: 65%; animation-delay: 3.8s; animation-duration: 7.2s; }
    .particle:nth-child(10) { left: 35%; animation-delay: 6.0s; animation-duration: 8.8s; background: #ff9000; box-shadow: 0 0 6px #ff9000; }
    .particle:nth-child(11) { left: 5%; animation-delay: 0.5s; animation-duration: 9.2s; width: 2px; height: 2px; }
    .particle:nth-child(12) { left: 75%; animation-delay: 2.2s; animation-duration: 7.8s; background: #bc8cff; box-shadow: 0 0 6px #bc8cff; }
    .particle:nth-child(13) { left: 90%; animation-delay: 4.8s; animation-duration: 6.2s; }
    .particle:nth-child(14) { left: 30%; animation-delay: 5.5s; animation-duration: 8.5s; width: 3px; height: 3px; }
    .particle:nth-child(15) { left: 45%; animation-delay: 1.5s; animation-duration: 7.0s; background: #ff9000; box-shadow: 0 0 6px #ff9000; }
    @keyframes particle-float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .container { position: relative; z-index: 2; }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 {
      font-size: 38px; font-weight: 800; letter-spacing: -1px; margin: 0 0 16px 4px; padding: 0;
      color: transparent;
      background: linear-gradient(90deg,#ff5050,#ff9000,#bc8cff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-subtitle {
      font-size: 16px; color: rgba(255,255,255,0.6); margin-top: 8px; line-height: 1.5;
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
    .card.aura { min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
    .card.aura .desc { font-size: 14px; color: rgba(255,255,255,0.55); margin-top: 4px; line-height: 1.5; padding: 0 20px 16px; }
    .card.aura a { text-decoration: none; color: inherit; display: block; padding: 20px 20px 0; }
    a.card-link { text-decoration: none; }
    .card.aura.clickable { cursor: pointer; }
    @media (max-width: 768px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

<div class="container">

<div class="hero">

</div>

<div class="cards" style="max-width:900px;margin:0 auto;">

      <div class="card-header"><div class="card-header-row"><h2>425-ФЗ</h2></div></div>

  <!-- Сбер -->
  <a href="sber2.html" class="card-link">
    <div class="card orange aura">
      <div class="card-header"><div class="card-header-row"><h2>Сбер</h2></div></div>
      <div class="desc">Цифровые сервисы Сбера: наследство, соцконсультант, БТ, планирование.</div>

</div>

<div class="footer">
  <span class="tech">🔥 Феникс · Июль 2026</span>
</div>

</div>

</body>
</html>
