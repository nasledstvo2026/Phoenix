<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>425-ФЗ — Феникс 🔥</title>
  <style>
    :root {
      --glass-bg: rgba(22, 27, 34, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.12);
      --text: #e6edf3;
      --text-dim: #8b949e;
      --blue: #58a6ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0e14;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(88,166,255,.08), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(188,140,255,.06), transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      padding: 10px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      transition: border-color .2s, background .2s;
      margin-bottom: 32px;
    }
    .back-btn:hover {
      border-color: var(--glass-hover);
      background: rgba(255,255,255,0.08);
    }
    .back-arrow { font-size: 16px; }
    h1 {
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", Palatino, serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .placeholder {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-dim);
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">
    <span class="back-arrow">←</span> Назад
  </a>
  <h1>425-ФЗ</h1>
  <div class="placeholder">Здесь будет контент</div>
</div>
</body>
</html>
