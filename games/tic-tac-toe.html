<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики · 5 в ряд</title>
<style>
  :root {
    --bg1: #1e1b2e;
    --bg2: #2a2440;
    --card: #241f3a;
    --cell: #2f2947;
    --cell-hover: #3a3258;
    --x: #a78bfa;
    --o: #fb7185;
    --win: #34d399;
    --text: #ede9fe;
    --muted: #9a93b5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #3b2d63 0%, var(--bg1) 55%, var(--bg2) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    padding: 16px;
  }
  .wrap {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 22px 24px 26px;
    width: 100%;
    max-width: 620px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    text-align: center;
  }
  h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 3px;
  }
  .sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .score {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .score .p {
    background: var(--cell);
    border-radius: 12px;
    padding: 7px 16px;
    min-width: 74px;
  }
  .score .p .who { font-size: 17px; font-weight: 800; }
  .score .p .n { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .score .p.x .who { color: var(--x); }
  .score .p.o .who { color: var(--o); }
  .status {
    font-size: 14.5px;
    font-weight: 600;
    min-height: 20px;
    margin-bottom: 13px;
    color: var(--muted);
  }
  .status.win { color: var(--win); }
  .board {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 2px;
    margin: 0 auto 16px;
    max-width: 560px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 2px;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(11px, 3.2vmin, 20px);
    font-weight: 800;
    line-height: 1;
    transition: background .12s ease;
    user-select: none;
  }
  .cell:not(.taken):hover { background: var(--cell-hover); }
  .cell.taken { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: rgba(52,211,153,0.35); }
  .cell.pop { animation: pop .16s ease; }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0.3; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 13px;
    flex-wrap: wrap;
  }
  .modes button {
    background: var(--cell);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 11px;
    padding: 8px 13px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }
  .modes button.active {
    background: #6d28d9;
    color: #fff;
    border-color: #8b5cf6;
  }
  .reset {
    background: linear-gradient(135deg, #6d28d9, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 22px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease, filter .15s ease;
    font-family: inherit;
  }
  .reset:hover { filter: brightness(1.08); }
  .reset:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Крестики-нолики · 5 в ряд</h1>
  <div class="sub">X — фиолетовый · O — розовый · побеждает 5 в линию</div>

  <div class="score">
    <div class="p x"><div class="who" id="sx">0</div><div class="n">Игрок X</div></div>
    <div class="p o"><div class="who" id="so">0</div><div class="n" id="olabel">Компьютер</div></div>
  </div>

  <div class="status" id="status">Ход: X</div>

  <div class="board" id="board"></div>

  <div class="modes">
    <button id="m-ai" class="active">Против компьютера</button>
    <button id="m-pvp">Два игрока</button>
  </div>

  <button class="reset" id="reset">Новая игра</button>
</div>

<script>
(function () {
  const SIZE = 15;
  const WIN_LEN = 5;
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  const HUMAN = 'X', AI = 'O';

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const sx = document.getElementById('sx');
  const so = document.getElementById('so');
  const olabel = document.getElementById('olabel');
  const mAi = document.getElementById('m-ai');
  const mPvp = document.getElementById('m-pvp');
  const resetBtn = document.getElementById('reset');

  let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  let cells = [];
  let current = 'X';
  let mode = 'ai';
  let scores = { X: 0, O: 0 };
  let gameOver = false;
  let aiTimer = null;

  function inB(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

  function checkWin(r, c, player) {
    for (const [dr, dc] of DIRS) {
      let count = 1;
      const line = [[r, c]];
      let nr = r + dr, nc = c + dc;
      while (inB(nr, nc) && board[nr][nc] === player) { count++; line.push([nr, nc]); nr += dr; nc += dc; }
      nr = r - dr; nc = c - dc;
      while (inB(nr, nc) && board[nr][nc] === player) { count++; line.push([nr, nc]); nr -= dr; nc -= dc; }
      if (count >= WIN_LEN) return line;
    }
    return null;
  }

  function isDraw() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!board[r][c]) return false;
    return true;
  }

  function updateScore() { sx.textContent = scores.X; so.textContent = scores.O; }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function nameOf(p) {
    if (p === HUMAN) return 'Игрок X';
    return mode === 'ai' ? 'Компьютер' : 'Игрок O';
  }

  // --- AI (эвристика: атака + защита по паттернам линий) ---
  function patternScore(count, open) {
    if (count >= WIN_LEN) return 1000000;
    if (open === 0) return 0;               // закрытая линия — бесперспективна
    if (count === 4) return open === 2 ? 100000 : 10000;
    if (count === 3) return open === 2 ? 8000 : 500;
    if (count === 2) return open === 2 ? 500 : 50;
    if (count === 1) return open === 2 ? 20 : 2;
    return 0;
  }

  function dirScore(r, c, dr, dc, player) {
    let count = 1, open = 0;
    let nr = r + dr, nc = c + dc;
    while (inB(nr, nc) && board[nr][nc] === player) { count++; nr += dr; nc += dc; }
    if (inB(nr, nc) && !board[nr][nc]) open++;
    nr = r - dr; nc = c - dc;
    while (inB(nr, nc) && board[nr][nc] === player) { count++; nr -= dr; nc -= dc; }
    if (inB(nr, nc) && !board[nr][nc]) open++;
    return patternScore(count, open);
  }

  function cellScore(r, c, player) {
    let s = 0;
    for (const [dr, dc] of DIRS) s += dirScore(r, c, dr, dc, player);
    return s;
  }

  function candidates() {
    const set = new Set();
    let any = false;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (board[r][c]) {
        any = true;
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
          const nr = r + dr, nc = c + dc;
          if (inB(nr, nc) && !board[nr][nc]) set.add(nr * SIZE + nc);
        }
      }
    }
    if (!any) return [Math.floor(SIZE / 2) * SIZE + Math.floor(SIZE / 2)];
    return [...set];
  }

  function aiMove() {
    const cands = candidates();
    let best = -Infinity, bestMoves = [];
    for (const idx of cands) {
      const r = Math.floor(idx / SIZE), c = idx % SIZE;
      board[r][c] = AI;
      const atk = cellScore(r, c, AI);
      board[r][c] = null;
      board[r][c] = HUMAN;
      const def = cellScore(r, c, HUMAN);
      board[r][c] = null;
      const score = atk + def * 0.9;
      if (score > best) { best = score; bestMoves = [idx]; }
      else if (score === best) { bestMoves.push(idx); }
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
  }

  // --- ход ---
  function place(r, c) {
    if (gameOver || board[r][c]) return;
    const player = current;
    board[r][c] = player;
    const el = cells[r][c];
    el.textContent = player === 'X' ? '✕' : '◯';
    el.classList.add('taken', player === 'X' ? 'x' : 'o', 'pop');

    const win = checkWin(r, c, player);
    if (win) {
      gameOver = true;
      for (const [wr, wc] of win) cells[wr][wc].classList.add('win');
      scores[player]++;
      updateScore();
      setStatus(nameOf(player) + ' победил! 🎉', 'win');
      return;
    }
    if (isDraw()) { gameOver = true; setStatus('Ничья 🤝'); return; }

    current = player === 'X' ? 'O' : 'X';
    setStatus('Ход: ' + current);

    if (mode === 'ai' && current === AI && !gameOver) {
      aiTimer = setTimeout(() => {
        const m = aiMove();
        place(Math.floor(m / SIZE), m % SIZE);
      }, 220);
    }
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.addEventListener('click', () => place(r, c));
        boardEl.appendChild(el);
        row.push(el);
      }
      cells.push(row);
    }
  }

  function newGame() {
    clearTimeout(aiTimer);
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    current = 'X';
    gameOver = false;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const el = cells[r][c];
      el.textContent = '';
      el.className = 'cell';
    }
    setStatus('Ход: X');
  }

  function setMode(m) {
    mode = m;
    mAi.classList.toggle('active', m === 'ai');
    mPvp.classList.toggle('active', m === 'pvp');
    olabel.textContent = m === 'ai' ? 'Компьютер' : 'Игрок O';
    scores = { X: 0, O: 0 };
    updateScore();
    newGame();
  }

  mAi.addEventListener('click', () => setMode('ai'));
  mPvp.addEventListener('click', () => setMode('pvp'));
  resetBtn.addEventListener('click', () => { scores = { X: 0, O: 0 }; updateScore(); newGame(); });

  renderBoard();
  setStatus('Ход: X');
})();
</script>
</body>
</html>
