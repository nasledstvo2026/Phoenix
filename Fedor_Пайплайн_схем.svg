<rect width="1280" height="1000" fill="#ffffff"/>
<text x="40" y="46" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Пайплайн создания схем по ИП (исполнительному производству)</text>
